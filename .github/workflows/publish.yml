name: Publish to npm

# Trusted Publishing: no npm token needed. Register this workflow once on npmjs.com
# (package -> Settings -> Trusted Publisher: GitHub Actions, repo Dress13/homebridge-bose-soundtouch, workflow publish.yml).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm publish
