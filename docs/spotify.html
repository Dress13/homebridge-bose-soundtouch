<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Spotify login - homebridge-bose-soundtouch</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #212529; margin: 0; padding: 16px; }
  main { max-width: 560px; margin: 8vh auto 0; background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { line-height: 1.5; margin: 0 0 12px; }
  .btn { display: inline-block; background: #1db954; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 16px; cursor: pointer; text-decoration: none; }
  .btn.secondary { background: #6c757d; }
  textarea { width: 100%; box-sizing: border-box; height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin: 0 0 12px; }
  .box { border-top: 1px solid #dee2e6; margin-top: 18px; padding-top: 18px; }
  .hidden { display: none; }
  .err { color: #dc3545; }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1d21; color: #e9ecef; }
    main { background: #2a2d33; box-shadow: none; }
    .box { border-color: #495057; }
    textarea { background: #1b1d21; color: #e9ecef; border: 1px solid #495057; }
  }
</style>
</head>
<body>
<main>
  <h1 id="title">Spotify login</h1>
  <p id="msg"></p>
  <p id="auto" class="hidden"><a id="back" class="btn" href="#">Back to Homebridge</a></p>
  <div id="manual" class="box hidden">
    <p id="manualText"></p>
    <textarea id="addr" readonly></textarea>
    <button id="copy" class="btn secondary">Copy address</button>
  </div>
</main>
<script>
// Spotify only redirects to https (or 127.0.0.1). This page hands the login code on to the
// user's own Homebridge. Nothing is stored or sent anywhere else.
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), state = q.get('state') || '', error = q.get('error');
  var $ = function (id) { return document.getElementById(id); };
  var show = function (id) { $(id).classList.remove('hidden'); };

  if (error || !code) {
    $('title').textContent = 'Spotify login failed';
    $('msg').className = 'err';
    $('msg').textContent = error
      ? 'Spotify reported: ' + error + '. Go back to Homebridge and click "Connect Spotify" again.'
      : 'This page is only used during the Spotify login of the homebridge-bose-soundtouch plugin.';
    return;
  }

  // state = "<random>.<base64url of the Homebridge return address>"
  var target = null;
  try {
    var b64 = state.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    var u = new URL(atob(b64));
    if (u.protocol === 'http:' && u.pathname === '/spotify-callback' && !u.username && !u.search && !u.hash) {
      target = u;
    }
  } catch (e) { /* no return address: manual copy only */ }

  $('addr').value = location.href;
  $('copy').onclick = function () {
    $('addr').select();
    var done = function () { $('copy').textContent = 'Copied'; };
    if (navigator.clipboard) { navigator.clipboard.writeText(location.href).then(done, function () { document.execCommand('copy'); done(); }); }
    else { document.execCommand('copy'); done(); }
  };
  show('manual');

  if (!target) {
    $('msg').textContent = 'Login successful. One step left:';
    $('manualText').textContent = 'Copy this address and paste it into "Finish login" in the plugin settings.';
    return;
  }

  target.search = '?' + new URLSearchParams({ code: code, state: state }).toString();
  $('back').href = target.href;
  show('auto');
  $('manualText').textContent = 'If Homebridge does not open: copy this address and paste it into "Finish login" in the plugin settings.';

  // Go back automatically once; after a failed attempt (browser "back") stay here and offer the copy.
  var key = 'tried-' + state, tried = false;
  try { tried = sessionStorage.getItem(key) === '1'; sessionStorage.setItem(key, '1'); } catch (e) { /* ignore */ }
  if (tried) {
    $('msg').textContent = 'Login successful, but Homebridge could not be opened automatically.';
  } else {
    $('msg').textContent = 'Login successful. Returning to Homebridge...';
    location.replace(target.href);
  }
})();
</script>
</body>
</html>
